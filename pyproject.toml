[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4-pay-gate"
version = "0.1.0"
description = "Reference gate: an AI agent can pay through PayPal only for the exact order a person approved."
license = {text = "Apache-2.0"}
authors = [{name = "The Singulant", email = "support@thesingulant.ai"}]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "cryptography>=42", "pydantic>=2.6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["ai4_pay_gate"]

[tool.setuptools.package-data]
ai4_pay_gate = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
